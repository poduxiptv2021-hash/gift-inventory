<style>
    body { background: #fbf9f9; color: #1b1c1c; font-family: 'Hanken Grotesk', sans-serif; -webkit-font-smoothing: antialiased; }
    h1, h2, h3, .nav-pill, .brand-text, .eyebrow, .btn-primary, .admin-tab { font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 0.1em; }
    .spin { animation: spin 1s linear infinite; display:inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    button { cursor: pointer; }
    svg { display:block; }

    .topbar { display:flex; align-items:center; justify-content:space-between; padding: 24px 40px; border-bottom: 1px solid #e2e2e2; background: #ffffff; }
    .brand { display:flex; align-items:center; gap:12px; background:none; border:none; padding:0; }
    .brand-mark { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; background: #000000; color: #ffffff; }
    .brand-text { font-weight:700; font-size:14px; color: #000000; }
    .brand-text em { font-style: normal; color: #7e7576; font-weight: 400; font-size: 11px; margin-left: 4px; }

    .topnav { display:flex; gap:32px; }
    .nav-pill { font-size:12px; font-weight:600; padding:4px 0; border-bottom: 2px solid transparent; color: #7e7576; transition: all .2s; background: transparent; }
    .nav-pill:hover { color: #000000; }
    .nav-pill.active { color: #000000; border-color: #000000; }

    .main-area { max-width: 1280px; margin: 0 auto; padding: 64px 40px; }
    .loading-block { display:flex; align-items:center; gap:10px; justify-content:center; padding: 80px 0; color: #7e7576; font-size: 14px; }

    .card { background: #ffffff; border: 1px solid #e2e2e2; padding: 32px; }
    .hero-tag { margin-bottom: 48px; }
    .eyebrow { font-size:10px; font-weight:700; color: #000000; margin-bottom: 12px; }
    .hero-tag h1 { font-size:32px; font-weight:700; line-height:1.2; margin-bottom: 16px; color: #000000; }
    .hero-sub { color: #4c4546; font-size: 15px; line-height:1.6; max-width: 600px; margin:0; }

    .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
    .field { display:flex; flex-direction:column; gap:8px; font-size:12px; margin-bottom:20px; }
    .field-label { font-family: 'Montserrat', sans-serif; font-weight:700; text-transform: uppercase; color: #000000; letter-spacing: 0.05em; }
    .field input, .field select, .field textarea {
      font-family:'Hanken Grotesk'; font-size:14px; padding:12px; border:1px solid #e2e2e2; background:#fff; color: #000; outline:none; width:100%; transition: all .2s;
    }

    /* Form fields background logic */
    .field input:placeholder-shown,
    .field textarea:placeholder-shown,
    .field select[value=""],
    #event-date-input:not(.has-value) {
      background-color: #ffffff !important;
    }

    /* Standard filled background: Brand Green Tint */
    .field input:not(:placeholder-shown):not(.gift-qty-input-field), 
    .field textarea:not(:placeholder-shown),
    .field select:not([value=""]):not([value=""]),
    #event-date-input.has-value {
      background-color: rgba(47, 111, 98, 0.06) !important;
    }

    /* CRITICAL: Gift catalog quantity inputs MUST remain white at all times */
    .gift-qty-input input.gift-qty-input-field {
      background-color: #ffffff !important;
    }

    /* Standardized focus state for ALL inputs (brand red) */
    .field input:focus, 
    .field select:focus, 
    .field textarea:focus { 
      border-color: #A23B4C !important; 
      box-shadow: 0 0 0 4px rgba(162, 59, 76, 0.2) !important;
      background-color: #ffffff !important; 
    }

    .field-error { color: #ba1a1a; font-size:11px; font-weight:600; margin-top: 4px; text-transform: uppercase; }

    .gift-picker { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:24px; }
    .gift-option { display:flex; flex-direction:column; border:1px solid #e2e2e2; background:#fff; transition: all .2s; position:relative; }
    .gift-option:hover { border-color: #2F6F62; }
    .gift-option.selected { border: 2px solid #2F6F62; background: rgba(47, 111, 98, 0.06); }
    .gift-option-top { display:flex; flex-direction:column; width: 100%; text-align: left; }
    .gift-thumb { width:100%; height:200px; background: #f5f3f3; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; border-bottom: 1px solid #e2e2e2; }
    .gift-thumb img { width:100%; height:100%; object-fit:cover; }
    .gift-option-text { display:flex; flex-direction:column; font-size:13px; padding: 16px; }
    .gift-option-text strong { font-family: 'Montserrat', sans-serif; text-transform: uppercase; font-size: 13px; letter-spacing: 0.02em; line-height: 1.4; }
    .gift-qty-input { display: none; padding: 0 16px 16px 16px; }
    .gift-option.selected .gift-qty-input { display: block; }

    /* Quantity input specific styling */
    .gift-option.selected .gift-qty-input input.gift-qty-input-field { 
      height: 32px; 
      font-size: 11px; 
      padding: 4px 8px; 
      border: 1px solid #2F6F62; 
      outline: none; 
    }
    
    /* Quantity input focus state (Standardized to Brand Red) */
    .gift-option.selected .gift-qty-input input.gift-qty-input-field:focus {
      border-color: #A23B4C !important;
      box-shadow: 0 0 0 4px rgba(162, 59, 76, 0.2) !important;
    }

    .btn-primary { display:inline-flex; align-items:center; justify-content:center; gap:10px; font-weight:700; font-size:13px; padding:16px 32px; background: #000000; color:#ffffff; border:none; transition: opacity .2s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary.sm { padding: 10px 20px; font-size:11px; }
    .btn-primary.full { width:100%; }
    .btn-primary.brand-submit { background-color: #2F6F62; color: #ffffff; }
    .btn-primary.brand-submit:hover { background-color: #265a50; }
    
    .btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:'Montserrat'; text-transform: uppercase; font-weight:700; font-size:11px; padding:10px 20px; background:transparent; color: #000; border:1px solid #000; }
    .btn-ghost.danger { color: #ba1a1a; border-color: #ba1a1a; }

    .stat-row { display:grid; grid-template-columns: repeat(4, 1fr); gap:24px; margin-bottom: 40px; }
    .stat-card { border:1px solid #e2e2e2; padding:24px; background: #fff; }
    .stat-value { font-family:'Montserrat', sans-serif; font-size:28px; font-weight:700; margin-bottom: 4px; }
    .stat-label { font-family:'Montserrat', sans-serif; font-size:10px; font-weight:700; text-transform: uppercase; color: #7e7576; letter-spacing: 0.05em; }

    .admin-tabs { display:flex; gap:40px; border-bottom:1px solid #e2e2e2; margin-bottom: 40px; }
    .admin-tab { font-size:12px; font-weight:700; padding:16px 0; background:transparent; border-bottom:2px solid transparent; color: #7e7576; }
    .admin-tab.active { color: #000; border-color: #000; }
    .admin-tab.logout { margin-left:auto; border-bottom:none; color: #ba1a1a; }

    .gift-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:24px; }
    .gift-card-img { height:180px; background: #f5f3f3; display:flex; align-items:center; justify-content:center; overflow: hidden; }
    .gift-card-img img { width:100%; height:100%; object-fit: cover; }
    .gift-card-body { padding:20px 0; }
    .gift-card-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 4px; }
    .gift-card-top strong { font-family: 'Montserrat', sans-serif; text-transform: uppercase; font-size: 14px; letter-spacing: 0.02em; }
    .low-pill { background: #ba1a1a; color: #fff; font-size: 9px; font-weight: 700; padding: 2px 6px; text-transform: uppercase; }

    .request-card { position: relative; margin-bottom: 16px; border: 1px solid #e2e2e2; padding: 24px; }
    .badge { font-family: 'Montserrat', sans-serif; font-size:10px; font-weight:700; padding:4px 12px; text-transform: uppercase; border: 1px solid currentColor; }

    .toast { position:fixed; bottom:40px; right:40px; display:flex; align-items:center; gap:12px; background: #000; color:#fff; padding:16px 24px; font-family:'Montserrat'; font-size:12px; font-weight:700; text-transform: uppercase; letter-spacing: 0.05em; z-index:100; }

    /* Selection Summary Theming - Black Background */
    .selection-card { background: #000000; border: 1px solid #000000; padding: 32px; color: #ffffff; }
    .selection-card h3 { border-bottom-color: rgba(255,255,255,0.1) !important; color: #ffffff !important; }
    .order-summary-table { width: 100%; font-size: 12px; color: #ffffff; }
    .order-summary-table th { font-family: 'Montserrat', sans-serif; text-align: left; text-transform: uppercase; letter-spacing: 0.05em; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.2); font-size: 10px; color: rgba(255,255,255,0.5) !important; }
    .order-summary-table td { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .order-summary-total { font-family: 'Montserrat', sans-serif; font-weight: 700; text-transform: uppercase; padding-top: 16px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.2); margin-top: 8px; }
    .order-summary-total span:first-child { color: rgba(255,255,255,0.5); }
    .order-summary-total span:last-child { color: #ffffff; }

    #modal-root:empty { display: none; }
    #modal-root { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); padding: 20px; }

    @media (max-width: 768px) {
      .topbar { padding: 16px 20px; }
      .main-area { padding: 40px 20px; }
      .form-grid, .stat-row, .chart-row { grid-template-columns: 1fr; }
      .topnav { gap: 16px; }
    }
  

    /* ------------------------------------------------------------------ */
    /* v6 visual consistency pass                                         */
    /* ------------------------------------------------------------------ */
    :root {
      --page-bg: #f7f7f6;
      --surface: #ffffff;
      --surface-soft: #f3f3f1;
      --ink: #171817;
      --muted: #686b69;
      --line: #dedfdd;
      --line-strong: #bfc1be;
      --accent: #000000;
      --danger: #a81717;
      --radius: 8px;
      --shadow: 0 10px 30px rgba(20, 22, 20, 0.05);
    }

    * { box-sizing: border-box; }
    html { background: var(--page-bg); }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--ink);
      line-height: 1.55;
    }
    button, input, select, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .topbar {
      min-height: 72px;
      padding: 0 40px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.96);
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
      gap: 24px;
    }
    .brand { min-height: 72px; gap: 10px; flex-shrink: 0; }
    .brand img { height: 30px !important; width: auto; margin-right: 8px !important; }
    .brand-mark {
      width: 34px;
      height: 34px;
      min-width: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      line-height: 1;
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand-text { font-size: 15px; line-height: 1; letter-spacing: .08em; }
    .topnav { min-height: 72px; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .nav-pill {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 10px;
      line-height: 1;
      letter-spacing: .08em;
      white-space: nowrap;
    }
    .nav-pill:hover { background: var(--surface-soft); }
    .nav-pill.active { background: #111; color: #fff; border-color: #111; }

    .main-area {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 48px 40px 72px;
    }
    .sheet, .card, .chart-card, .stat-card, .selection-card {
      border-radius: var(--radius) !important;
    }
    .sheet {
      padding: 36px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .card {
      border: 1px solid var(--line) !important;
      background: var(--surface);
      box-shadow: none;
    }
    .card:hover { border-color: var(--line-strong) !important; }
    .stat-card, .chart-card {
      border: 1px solid var(--line) !important;
      background: var(--surface);
      box-shadow: none;
    }
    .stat-card { padding: 24px; min-height: 126px; }
    .chart-card { padding: 24px; }
    .selection-card { border: 1px solid #000 !important; padding: 28px; }

    h1 { margin: 0; font-size: clamp(25px, 3vw, 34px); line-height: 1.18; letter-spacing: .025em; }
    h2 { line-height: 1.25; }
    h3 { line-height: 1.35; }
    .eyebrow { margin: 0 0 10px; line-height: 1.2; letter-spacing: .13em; }
    .subtext { margin-top: 10px; max-width: 720px; color: var(--muted); line-height: 1.55; }

    .admin-tabs {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      min-height: 46px;
      margin: 0 0 24px;
      padding: 0 4px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }
    .admin-tab {
      min-height: 45px;
      padding: 0 16px;
      border: 0 !important;
      border-bottom: 2px solid transparent !important;
      background: transparent;
      font-size: 10px;
      line-height: 1;
      letter-spacing: .09em;
      white-space: nowrap;
    }
    .admin-tab:hover { color: #000; background: var(--surface-soft); }
    .admin-tab.active { color: #000; border-bottom-color: #000 !important; background: transparent; }

    .form-grid { gap: 20px 24px; }
    .field { gap: 7px; margin-bottom: 0; }
    .field label { margin: 0; line-height: 1.25; color: #343634; }
    .field input, .field select, .field textarea,
    input:not([type="checkbox"]):not([type="radio"]), select, textarea {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--line-strong) !important;
      border-radius: 6px !important;
      background: #fff;
      color: var(--ink);
      box-shadow: none !important;
      line-height: 1.4;
    }
    textarea { min-height: 104px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      border-color: #111 !important;
      outline: 2px solid rgba(0,0,0,.10) !important;
      outline-offset: 1px;
    }
    input[readonly] { background: #f3f3f1; color: #555957; }

    .btn-primary, .btn-ghost {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 18px;
      border-radius: 6px !important;
      font-size: 10px;
      line-height: 1;
      letter-spacing: .08em;
      font-weight: 700;
      white-space: nowrap;
      transition: background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease;
    }
    .btn-primary { border: 1px solid #000 !important; background: #000; color: #fff; }
    .btn-primary:hover { background: #252525; border-color: #252525 !important; transform: translateY(-1px); }
    .btn-ghost { border: 1px solid var(--line-strong) !important; background: #fff; color: #222; }
    .btn-ghost:hover { border-color: #222 !important; background: var(--surface-soft); }
    .btn-primary.sm, .btn-ghost.sm { min-height: 36px; padding: 0 14px; }
    .btn-ghost.danger { color: var(--danger); border-color: #d8aaaa !important; }
    .btn-ghost.danger:hover { background: #fff3f3; border-color: var(--danger) !important; }

    .badge {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      border: 1px solid currentColor;
      border-radius: 999px;
      background: #fff;
      font-size: 9px;
      line-height: 1.2;
      letter-spacing: .07em;
      white-space: nowrap;
    }

    .gift-grid { gap: 18px; }
    .gift-option { border: 1px solid var(--line) !important; border-radius: var(--radius) !important; overflow: hidden; }
    .gift-option:hover { border-color: var(--line-strong) !important; }
    .gift-option.selected { border: 2px solid #000 !important; }
    .gift-option.selected .gift-option-body { padding: 19px; }
    .gift-option-img { aspect-ratio: 16 / 10; height: auto; object-fit: cover; }
    .gift-option-body { padding: 20px; }

    .order-summary-table th, .order-summary-table td { vertical-align: middle; }
    .order-summary-table th { padding: 0 0 10px; }
    .order-summary-table td { padding: 12px 0; }

    .loading-block { min-height: 260px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    #toast-root { right: 20px; bottom: 20px; display: grid; gap: 10px; }
    .toast { min-width: 280px; max-width: 420px; padding: 14px 16px; border-radius: 6px; box-shadow: 0 12px 32px rgba(0,0,0,.16); }
    #modal-root { padding: 24px; background: rgba(13,14,13,.48); }
    #modal-root > * { max-height: calc(100vh - 48px); overflow-y: auto; }

    /* Login cards */
    .main-area > .max-w-5xl { max-width: 960px; }

  const safeRole = role === "admin" ? "admin" : "user";
  const testEmail = safeRole === "admin"

    : "test.user@phb.com.my";

  state.authed = true;
  state.role = safeRole;
  state.account = {
    name: safeRole === "admin" ? "Local Test Admin" : "Local Test User",

  };

  state.adminTab = "dashboard";

  state.selectedGifts = {};

  document.body.classList.remove("login-page");

    function userRequestAuditHTML(request) {
      const status = normalizeStatus(request.status);
      const liveEntries = Array.isArray(state.requestAudit[request.id])
        ? state.requestAudit[request.id]
        : [];
      const baselineEntries = [
        {
          key: "submitted",
          title: "Request submitted",
          date: request.submittedAt,
          actor: request.requesterName || "Requester"
        }
      ];

      if (status !== "pending approval") {
        baselineEntries.push({
          key: "approved",
          title: status === "rejected by approver" ? "Superior decision completed" : "Approved by Superior",
          date: request.ApprovedDate || request.approvedDate || request.submittedAt,
          actor: request.ApproverName || request.approverName || "Superior"
        });
      }

      const entries = [...baselineEntries, ...liveEntries]
        .filter((entry, index, array) => {
          const signature = `${entry.key || entry.title}|${entry.date || ""}|${entry.actor || ""}`;
          return array.findIndex(candidate =>
            `${candidate.key || candidate.title}|${candidate.date || ""}|${candidate.actor || ""}` === signature
          ) === index;
        })
        .sort((a, b) => new Date(a.date || 0).getTime() - new Date(b.date || 0).getTime());

      return `<div class="user-audit-timeline">${entries.map((entry, index) => `
        <div class="user-audit-entry ${index === entries.length - 1 ? "current" : ""}">

        </div>
      `).join("")}</div>`;
    }

    function requestAuditHTML(request) {
      const status = normalizeStatus(request.status);
      const liveEntries = Array.isArray(state.requestAudit[request.id])
        ? state.requestAudit[request.id]
        : [];

      // Baseline events must always remain visible. Previously, the first live
      // issuance event replaced this baseline array, causing Submitted and
      // Superior Approval to disappear from the timeline.
      const baselineEntries = [
        {
          key: "submitted",
          title: "Request submitted",
          date: request.submittedAt,
          actor: request.requesterName || "Requester"
        }
      ];

      if (status !== "pending approval") {
        baselineEntries.push({
          key: "approved",
          title: "Superior approval completed",
          date: request.ApprovedDate || request.approvedDate || request.submittedAt,
          actor: request.ApproverName || request.approverName || "Superior"
        });
      }

      // Merge baseline and live events instead of choosing one or the other.
      const entries = [...baselineEntries, ...liveEntries]
        .filter((entry, index, array) => {
          const signature = `${entry.key || entry.title}|${entry.date || ""}|${entry.actor || ""}`;
          return array.findIndex(candidate =>
            `${candidate.key || candidate.title}|${candidate.date || ""}|${candidate.actor || ""}` === signature
          ) === index;
        })
        .sort((a, b) => {
          const aTime = new Date(a.date || 0).getTime();
          const bTime = new Date(b.date || 0).getTime();
          return aTime - bTime;
        });

      return `<div class="workflow-timeline">${entries.map((entry, index) => `
        <div class="workflow-timeline-item ${index === entries.length - 1 ? "current" : ""}">
          <span class="workflow-dot"></span>
          <div>
            <strong>${esc(entry.title)}</strong>
            <p>${formatDateTime(entry.date)} · ${esc(entry.actor || "System")}</p>
            ${entry.remark ? `<small>${esc(entry.remark)}</small>` : ""}
          </div>
        </div>`).join("")}</div>`;
    }

        const status = normalizeStatus(r.status);
        if (state.requestFilter === "ready") return ["ready for collection", "partially ready for collection"].includes(status);
        if (state.requestFilter === "collected") return ["collected", "partially collected"].includes(status);
        return status === state.requestFilter;
      });
      const filters = [
        ["all","All"], ["pending approval","Pending"], ["approved","Approved"], ["ready","Ready for Collection"],
        ["collected","Collected"], ["rejected by approver","Rejected"], ["declined by ccd","Declined"]

              <div><p class="eyebrow">${esc(r.department || "Request")}</p><h3>${esc(r.eventName || "Gift Request")}</h3><p>${esc(r.requesterName || "")} · ${formatDate(r.eventDate)}</p></div>
              <span class="workflow-status" style="color:${meta.color};border-color:${meta.color}">${esc(meta.label)}</span>
            </div>
            <div class="workflow-item-grid">${items.map((item,i) => {
              const requested = Number(item.RequestedQty || item.Quantity || item.Qty || 0);
              const readyStage = [
                "ready for collection",
                "partially ready for collection",
                "collected",
                "partially collected"
              ].includes(status);
              const collectedStage = ["collected", "partially collected"].includes(status);
              const readyValue = readyStage
                ? Number(item.IssueQty ?? item.Quantity ?? item.Qty ?? 0)
                : "NA";
              const collectedValue = collectedStage
                ? Number(item.CollectedQty ?? item.IssueQty ?? item.Quantity ?? item.Qty ?? 0)
                : "NA";
              return `<div class="workflow-item-row">
                <strong>${esc(item.GiftName || item.GiftID || "Gift item")}</strong>
                <span>Requested <b>${requested}</b></span>
                <span>Ready <b class="${readyStage ? "" : "quantity-na"}">${readyValue}</b></span>
                <span>Collected <b class="${collectedStage ? "" : "quantity-na"}">${collectedValue}</b></span>
              </div>`;
            }).join("") || `<p class="text-sm text-gray-400">No item details available.</p>`}</div>
            <details class="workflow-details"><summary>View audit trail</summary>${requestAuditHTML(r)}</details>
            <div class="workflow-actions">
              ${status === "pending approval" ? `<span class="workflow-wait">Awaiting Superior approval in Microsoft Teams</span>` : ""}
              ${status === "approved" ? `<button class="btn-primary sm" data-prepare-request="${r.id}">Prepare for Collection</button><button class="btn-ghost sm danger" data-ccd-decline="${r.id}">Decline</button>` : ""}
              ${["ready for collection","partially ready for collection"].includes(status) ? `<button class="btn-primary sm" data-collect-request="${r.id}">Confirm Collection</button>` : ""}
            </div>

    function initializeSignatureCanvas() {
      const canvas = document.getElementById("collection-signature");
      if (!canvas) return;
      const context = canvas.getContext("2d");
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      const displayWidth = Math.max(canvas.clientWidth, 300);
      const displayHeight = 150;
      canvas.width = Math.floor(displayWidth * ratio);
      canvas.height = Math.floor(displayHeight * ratio);
      canvas.style.height = `${displayHeight}px`;
      context.scale(ratio, ratio);
      context.lineWidth = 2.2;
      context.lineCap = "round";
      context.lineJoin = "round";
      context.strokeStyle = "#171817";
      canvas.dataset.signed = "false";

      let drawing = false;
      const point = event => {
        const rect = canvas.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      };
      canvas.addEventListener("pointerdown", event => {
        drawing = true;
        canvas.setPointerCapture(event.pointerId);
        const p = point(event);
        context.beginPath();
        context.moveTo(p.x, p.y);
        event.preventDefault();
      });
      canvas.addEventListener("pointermove", event => {
        if (!drawing) return;
        const p = point(event);
        context.lineTo(p.x, p.y);
        context.stroke();
        canvas.dataset.signed = "true";
        const error = document.getElementById("signature-error");
        if (error) error.textContent = "";
        event.preventDefault();
      });
      const stop = event => {
        drawing = false;
        if (event?.pointerId !== undefined && canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      };
      canvas.addEventListener("pointerup", stop);
      canvas.addEventListener("pointercancel", stop);
      canvas.addEventListener("pointerleave", stop);

      const clear = document.getElementById("clear-signature");
      if (clear) clear.onclick = () => {
        context.clearRect(0, 0, displayWidth, displayHeight);
        canvas.dataset.signed = "false";
        const error = document.getElementById("signature-error");
        if (error) error.textContent = "";
      };
    }

    function bindWorkflowModalEvents() {
      document.querySelectorAll("[data-close-workflow]").forEach(b => b.onclick = () => document.getElementById("modal-root").innerHTML = "");
      const prepare = document.querySelector("[data-confirm-prepare]");
      if (prepare) prepare.onclick = () => {
        const request = state.requests.find(r => String(r.id) === String(prepare.dataset.confirmPrepare));
        let partial = false;
        request.items.forEach((item,index) => {
          const approved = Number(item.ApprovedQty ?? item.Quantity ?? item.Qty ?? 0);
          item.RequestedQty = Number(item.RequestedQty || item.Quantity || item.Qty || 0);
          item.ApprovedQty = approved;
          const previousReady = Number(item.IssueQty || 0);
          item.IssueQty = Number(document.querySelector(`[data-prepare-qty="${index}"]`)?.value || 0);
          item.CCDIssueRemark = document.querySelector(`[data-prepare-remark="${index}"]`)?.value || "";
          const gift = state.gifts.find(g => g.name === item.GiftName || String(g.id) === String(item.GiftID));
          if (gift) gift.reserved = Math.max(0, reservedStock(gift) - previousReady + item.IssueQty);
          if (item.IssueQty < approved) partial = true;
        });
        request.status = partial ? "partially ready for collection" : "ready for collection";
        state.requestAudit[request.id] = [...(state.requestAudit[request.id] || []), { key: "prepared", title: partial ? "Partially prepared by CCD" : "Ready for collection", date: new Date().toISOString(), actor: state.account?.name || "CCD Officer", remark: document.getElementById("collection-instructions")?.value || "" }];
        document.getElementById("modal-root").innerHTML = ""; notify("Request marked ready for collection"); render();
      };
      const collect = document.querySelector("[data-confirm-collection]");
      if (collect) collect.onclick = () => {
        const request = state.requests.find(r => String(r.id) === String(collect.dataset.confirmCollection));
        const collectedBy = document.getElementById("collected-by")?.value.trim();
        const collectionDateTime = document.getElementById("collection-datetime")?.value;
        const acknowledgement = document.getElementById("collection-ack")?.checked;
        const signatureCanvas = document.getElementById("collection-signature");
        const signatureError = document.getElementById("signature-error");

        if (!collectedBy || !collectionDateTime) {
          notify("Complete the recipient name and collection date", "error");
          return;
        }
        if (!acknowledgement) {
          notify("Recipient acknowledgement is required", "error");
          return;
        }
        if (!signatureCanvas || signatureCanvas.dataset.signed !== "true") {
          if (signatureError) signatureError.textContent = "Recipient signature is required.";
          notify("Recipient signature is required", "error");
          return;
        }

        const signatureDataUrl = signatureCanvas.toDataURL("image/png");
        let partial = false;
        request.items.forEach((item,index) => {
          const ready = Number(item.IssueQty ?? item.ApprovedQty ?? item.Quantity ?? item.Qty ?? 0);
          item.CollectedQty = Number(document.querySelector(`[data-collected-qty="${index}"]`)?.value || 0);
          if (item.CollectedQty < ready) partial = true;
          const gift = state.gifts.find(g => g.name === item.GiftName || String(g.id) === String(item.GiftID));
          if (gift) {
            gift.quantity = Math.max(0, physicalStock(gift) - item.CollectedQty);
            gift.reserved = Math.max(0, reservedStock(gift) - item.CollectedQty);
          }
        });
        request.status = partial ? "partially collected" : "collected";
        request.collectionReceipt = {
          collectedBy,
          collectionDateTime,
          signatureDataUrl,
          acknowledgement: true,
          remark: ""
        };
        state.requestAudit[request.id] = [...(state.requestAudit[request.id] || []), {
          key: "collected",
          title: partial ? "Partial collection recorded" : "Collection confirmed",
          date: collectionDateTime,
          actor: state.account?.name || "CCD Officer",
          remark: `Collected by ${collectedBy}`
        }];
        document.getElementById("modal-root").innerHTML = ""; notify("Collection recorded and local stock updated"); render();
      };
    }

function renderCharts() {

  if (typeof Chart === "undefined") {
    console.error("Chart.js not loaded");
    return;
  }

  Chart.getChart("stockChart")?.destroy();
  Chart.getChart("statusChart")?.destroy();

  const stockCtx = document.getElementById("stockChart");

  if (stockCtx && state.gifts.length > 0) {
    new Chart(stockCtx, {
      type: "bar",
      data: {
        labels: state.gifts.map(g => g.name),
        datasets: [{
          label: "Stock Qty",
          data: state.gifts.map(g => g.quantity),
          backgroundColor: "#2F6F62"
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  }

  const statusCtx = document.getElementById("statusChart");

  if (statusCtx) {

    const counts = {
      pending: 0,
      approved: 0,
      issued: 0,
      rejected: 0,
      declined: 0
    };

    state.requests.forEach(request => {
      const status = normalizeStatus(request.status);

      if (status === "pending approval") counts.pending += 1;
      else if (status === "approved") counts.approved += 1;
      else if (status === "issued") counts.issued += 1;
      else if (status === "rejected by approver") counts.rejected += 1;
      else if (status === "declined by ccd") counts.declined += 1;
    });

    new Chart(statusCtx, {
      type: "doughnut",
      data: {
        labels: ["pending", "approved", "issued", "rejected", "declined"],
        datasets: [{
          data: [
            counts.pending,
            counts.approved,
            counts.issued,
            counts.rejected,
            counts.declined
          ],
          backgroundColor: [
            "#C89B3C",
            "#2F6F62",
            "#000000",
            "#ba1a1a",
            "#7f3948"
          ]
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: "70%",
        plugins: {
          legend: {
            position: "bottom"
          }
        }
      }
    });

  }
}

      const session = JSON.parse(storedSession);
      if (session?.role && session?.account) {
        state.authed = true;
        state.role = session.role;
        state.account = session.account;
        state.view = session.role === "admin" ? "admin" : "user";
        state.userTab = "requests";
        msalReady.then(() => msalInstance.setActiveAccount(session.account)).catch(() => {});
      }
    } catch (error) {
      localStorage.removeItem("portalSession");
    }
  }
}
loadAll();
  </script>
</body></html>
